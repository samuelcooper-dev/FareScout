[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "farescout"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "amadeus>=9.0",
    "google-cloud-bigquery>=3.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "tenacity>=8.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
